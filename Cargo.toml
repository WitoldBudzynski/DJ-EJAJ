[workspace]
members = ["crates/app", "crates/audio", "crates/dsp", "crates/library", "crates/sampler"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
crossbeam-queue = "0.3"
hound = "3.5"

[profile.release]
lto = "thin"
codegen-units = 1
