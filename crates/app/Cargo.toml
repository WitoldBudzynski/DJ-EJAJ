[package]
name = "djejaj"
version.workspace = true
edition.workspace = true

[dependencies]
djejaj-audio = { path = "../audio" }
djejaj-dsp = { path = "../dsp" }
djejaj-library = { path = "../library" }
djejaj-sampler = { path = "../sampler" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
crossbeam-channel.workspace = true
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "wgpu"] }
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }
wgpu = { version = "27.0.1", default-features = false, features = ["metal", "wgsl"] }
rustfft = "6"

[dev-dependencies]
tempfile = "3"
